{% macro loading_block(title) -%}
<section class="space-y-4 rounded-lg border border-zinc-800 bg-zinc-950/40 p-4">
  <div class="space-y-2">
    <div class="h-4 w-28 rounded bg-zinc-800"></div>
    <div class="h-3 w-40 rounded bg-zinc-900"></div>
  </div>
  <div class="space-y-2">
    <div class="h-3 w-full rounded bg-zinc-900"></div>
    <div class="h-3 w-5/6 rounded bg-zinc-900"></div>
    <div class="h-3 w-2/3 rounded bg-zinc-900"></div>
  </div>
  <span class="sr-only">{{ title }} loading</span>
</section>
{%- endmacro %}
