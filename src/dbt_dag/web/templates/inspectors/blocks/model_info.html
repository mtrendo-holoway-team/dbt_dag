<section id="{{ block_id }}" class="space-y-3 rounded-lg border border-zinc-800 bg-zinc-950/40 p-4">
  <h2 class="text-sm font-medium">Model info</h2>
  <dl class="grid gap-3 text-sm sm:grid-cols-2">
    <div class="rounded-lg border border-zinc-800 bg-zinc-900/70 p-3">
      <dt class="text-xs text-zinc-500">Model name</dt>
      <dd class="mt-1 text-zinc-100">{{ inspector.node.name }}</dd>
    </div>
    <div class="rounded-lg border border-zinc-800 bg-zinc-900/70 p-3">
      <dt class="text-xs text-zinc-500">Full id</dt>
      <dd class="mt-1 break-all text-zinc-100">{{ inspector.node.unique_id }}</dd>
    </div>
  </dl>
</section>
