{% from "inspectors/macros.html" import loading_block %}
<section class="divide-y divide-stone-500">
    <header class="px-5 pb-5 space-y-1">
        <p class="text-xs uppercase tracking-wide text-cyan-400">{{ node.resource_type }}</p>
        <h1 class="text-lg font-semibold">{{ node.name }}</h1>
        <p class="break-all text-xs text-zinc-500">{{ node.unique_id }}</p>
        <p class="text-sm leading-6 text-zinc-300">{{ node.description or "No description." }}</p>
    </header>
    <div id="{{ actions_block_id }}"
         data-inspector-refresh="none"
         hx-get="/inspector/node/{{ node.unique_id | urlencode }}/actions?selection_token={{ selection_token }}"
         hx-trigger="load"
         hx-target="this"
         hx-swap="outerHTML">{{ loading_block("Actions") }}</div>
    <div id="{{ last_update_block_id }}"
         data-inspector-refresh="metadata"
         hx-get="/inspector/node/{{ node.unique_id | urlencode }}/last-update?selection_token={{ selection_token }}"
         hx-trigger="load"
         hx-target="this"
         hx-swap="outerHTML">{{ loading_block("Last update") }}</div>
    <div id="{{ partition_block_id }}"
         data-inspector-refresh="metadata"
         hx-get="/inspector/node/{{ node.unique_id | urlencode }}/partition?selection_token={{ selection_token }}"
         hx-trigger="load"
         hx-target="this"
         hx-swap="outerHTML">{{ loading_block("Partition") }}</div>
    <div id="{{ tasks_block_id }}"
         data-inspector-refresh="metadata"
         hx-get="/inspector/node/{{ node.unique_id | urlencode }}/tasks?selection_token={{ selection_token }}"
         hx-trigger="load"
         hx-target="this"
         hx-swap="outerHTML">{{ loading_block("Tasks") }}</div>
</section>
