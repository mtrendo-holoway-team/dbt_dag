[tool.poetry]
name = "dbt-dag"
version = "0.1.5"
description = "Local dbt DAG visualizer"
authors = ["dbt DAG contributors"]
readme = "README.md"
packages = [{ include = "dbt_dag", from = "src" }]
include = [
    { path = "src/dbt_dag/web/static/dist", format = ["sdist", "wheel"] },
    { path = "src/dbt_dag/web/static/dist/.vite/manifest.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
alembic = "^1.13.3"
dbt-bigquery = "^1.8.0"
dbt-clickhouse = "^1.8.0"
dbt-core = "^1.8.0"
litestar = "^2.12.1"
pydantic = "^2.9.2"
python-dotenv = "^1.0.1"
pyyaml = "^6.0.2"
sqlalchemy = "^2.0.35"
uvicorn = "^0.32.0"

[tool.poetry.group.dev.dependencies]
autoflake = "^2.3.1"
black = "^24.8.0"
flake8 = "^7.1.1"
isort = "^5.13.2"
mypy = "^1.11.2"
dotenv-linter = "^0.4.0"
pytest = "^8.3.3"
pytest-mock = "^3.14.0"
pytest-cov = "^4.1.0"
pytest-deadfixtures = "^2.2.1"
pytest-env = "^1.1.3"
pytest-freezegun = "^0.4.2"
pytest-randomly = "^3.15.0"
types-PyYAML = "^6.0.12.20240917"
flake8-absolute-import = "^1.0.0.2"
flake8-black = "^0.3.6"
flake8-bugbear = "^24.2.6"
flake8-cognitive-complexity = "^0.1.0"
flake8-eradicate = "^1.5.0"
flake8-fixme = "^1.1.1"
flake8-isort = ">=4.0.0"
flake8-pep3101 = "^2.1.0"
flake8-pie = "^0.16.0"
flake8-print = "^5.0.0"
flake8-printf-formatting = "^1.1.2"
flake8-pyproject = "^1.2.3"
flake8-pytest = "^1.4"
flake8-pytest-style = "^1.7.2"
flake8-simplify = "^0.21.0"
flake8-todo = "^0.7"
flake8-use-fstring = "^1.4"
flake8-variables-names = "^0.0.6"
flake8-walrus = "^1.2.0"

[tool.poetry.scripts]
dbt-dag = "dbt_dag.app:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
python_version = "3.11"
strict = true
plugins = []


[tool.flake8]
max-line-length = 100
inline-quotes = "\""
ignore = [
    "E704", # Multiple statements on one line
    "E501",  # Line too long
    "E265",  # Block comments should have one space before the pound sign (#) and the comment itself
    "F811",  # Redefinition of unused name from line n
    "PT001",  # Use @pytest.fixture() over @pytest.fixture
    "SIM102",  # Use a single if-statement instead of nested if-statements
    "SIM113",  # Use enumerate instead of manually incrementing a counter
    "E203",  # whitespace before ':', disabled for black purposes https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html#slices
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "src/mp/integrations/generated",
]

[tool.isort]
profile = "google"
line_length = 100
extra_standard_library = ["pytest"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
use_parentheses = true
include_trailing_comma = true
multi_line_output = 3

[tool.black]
line_length = 100

[tool.pyright]
reportIncompatibleVariableOverride = false
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test*.py"]
addopts = ["-m", "not slow"]  
markers = [
   "freeze_time: freezing time marker (pytest-freezegun does not register it)",
   "slow: marks tests as slow to run",
 ]
filterwarnings = [ 
   "ignore:distutils Version classes are deprecated. Use packaging.version instead.:DeprecationWarning:pytest_freezegun:17",
]
